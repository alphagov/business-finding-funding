# Redis, for running Find funding and its tests locally with answers kept as
# they are on Heroku:
#
#   docker compose up -d --wait
#   REDIS_URL=redis://localhost:6379 npm run dev
#   TEST_REDIS_URL=redis://localhost:6379 npm test
#
# Without it, answers are kept in memory, and the Redis tests are skipped.
services:
  redis:
    image: redis:8
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15
